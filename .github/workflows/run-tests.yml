name: Run PR Checks

on:
  push:

jobs:
  prcheck:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
      CHALICE_TEST_EXTENDED_PACKAGING: true
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        name: Set up Python 3.13
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          make install-dev-deps
      - name: Run PRCheck
        run: make prcheck
  merge-checks-complete:
        runs-on: ubuntu-latest
        needs: [prcheck]
        # Runs on every prcheck outcome: a skipped job reports as satisfied to
        # branch protection, so this has to run and fail rather than be skipped.
        if: always()
        steps:
          - name: merge-checks-complete
            run: |
              if [ "${{ needs.prcheck.result }}" != "success" ]; then
                echo "prcheck concluded: ${{ needs.prcheck.result }}"
                exit 1
              fi
              echo 0
